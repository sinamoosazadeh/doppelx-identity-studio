      <div>
        <h1>DOPPEL X</h1>
        <small>Identity Studio</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btn-theme" title="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
    <button class="iconbtn" id="btn-settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <main id="main"></main>
</div>
<div class="toast-wrap" id="toasts"></div>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>
<nav class="tabbar">
  <div class="tabbar-in">
    <button class="tabbtn" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home
    </button>
    <button class="tabbtn" data-nav="profiles">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg>Profiles
    </button>
    <button class="tabbtn" data-nav="lab">
      <svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6l-5.5 9.5A2.5 2.5 0 0 0 7 22h10a2.5 2.5 0 0 0 2.5-3.5L14 9V3"/><path d="M6.5 15h11"/></svg>Lab
    </button>
    <button class="tabbtn" data-nav="api">
      <svg viewBox="0 0 24 24"><path d="m8 8-5 4 5 4"/><path d="m16 8 5 4-5 4"/><path d="m13 4-2 16"/></svg>Export

    <button class="tabbtn" data-nav="vault">

    </button>
  </div>
</nav>
